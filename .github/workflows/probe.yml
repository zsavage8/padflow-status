name: probe
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe components
        run: |
          set -u
          mkdir -p docs/data
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          parts=""
          check () {
            name="$1"; url="$2"
            up=0; code="000"; secs="20.000"
            for attempt in 1 2; do
              out=$(curl -L -o /dev/null -s -w "%{http_code} %{time_total}" --max-time 20 "$url" || echo "000 20.000")
              code=${out% *}
              secs=${out#* }
              case "$code" in 2*) up=1 ;; esac
              [ "$up" = "1" ] && break
              sleep 10
            done
            echo "$ts,$name,$code,$secs,$up" >> docs/data/history.csv
            parts="$parts{\"name\":\"$name\",\"code\":\"$code\",\"seconds\":$secs,\"up\":$up},"
          }
          check app "https://padflow.io/"
          check api "https://padflow.io/api/health"
          check docs "https://padflow.io/docs"
          tail -n 78000 docs/data/history.csv > docs/data/history.tmp
          mv docs/data/history.tmp docs/data/history.csv
          printf '{"ts":"%s","components":[%s]}\n' "$ts" "${parts%,}" > docs/data/latest.json
      - name: commit
        run: |
          git config user.name "padflow-probe"
          git config user.email "probe@padflow.io"
          git add docs/data
          git commit -m "probe" || exit 0
          git pull --rebase --autostash || true
          git push
